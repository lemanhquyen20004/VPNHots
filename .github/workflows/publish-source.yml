name: Publish VPNHots customized source

on:
  push:
    branches:
      - build/vpnhotspot-ui
    paths:
      - .github/workflows/publish-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout VPNHots main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Import upstream VPN Hotspot sources
        shell: bash
        run: |
          git -C target remote add upstream https://github.com/Mygod/VPNHotspot.git
          git -C target fetch --depth=1 upstream 6e3d4a4f9db4f72d0d4a422350b5234cddb52c48
          git -C target restore --source=FETCH_HEAD --staged --worktree .

