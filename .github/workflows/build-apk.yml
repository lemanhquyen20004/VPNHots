name: Build VPNHots UI APK

on:
  push:
    branches:
      - build/vpnhotspot-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out original VPN Hotspot
        uses: actions/checkout@v4
        with:
          repository: Mygod/VPNHotspot
          ref: 6e3d4a4f9db4f72d0d4a422350b5234cddb52c48
          submodules: recursive
          path: upstream

      - name: Check out VPNHots UI sources
        uses: actions/checkout@v4
        with:
          path: custom

