name: Build VPNHots Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout VPNHots source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        shell: bash
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build debug APKs from published source
        run: ./gradlew :mobile:assembleDebug --no-daemon

      - name: Archive built APKs
        uses: actions/upload-artifact@v4
        with:
          name: VPNHots-APK-Debug
          path: mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
