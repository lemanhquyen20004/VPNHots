      - name: Apply polished dashboard and wire real controls
        shell: bash
        run: |
          cp custom/ui/v2/TetheringDashboard.kt upstream/mobile/src/main/java/be/mygod/vpnhotspot/ui/TetheringDashboard.kt
          cp custom/ui/v2/ui_v2.xml upstream/mobile/src/main/res/values/ui_v2.xml
          cp custom/ui/v2/ui_v2_vi.xml upstream/mobile/src/main/res/values-vi/ui_v2.xml
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('upstream/mobile/src/main')
          tether = root / 'java/be/mygod/vpnhotspot/ui/TetheringScreen.kt'
          t = tether.read_text()
          old = '    onStartRepeaterWps: (String?) -> Unit,\n)'
          new = '    onStartRepeaterWps: (String?) -> Unit,\n    connectedDeviceCount: Int = 0,\n    onOpenClients: () -> Unit = {},\n)'
          assert t.count(old) == 1
          t = t.replace(old, new)
          old = '                    onManageTethering = { ManageBar.start(context::startActivity) },\n'
          new = old + '                    connectedDeviceCount = connectedDeviceCount,\n                    onOpenClients = onOpenClients,\n'
          assert t.count(old) == 1
          tether.write_text(t.replace(old, new))
          app = root / 'java/be/mygod/vpnhotspot/ui/VpnHotspotApp.kt'
          t = app.read_text()
          old = '                        interfaceRefreshVersion = tetheringInterfaceRefreshVersion,\n'
          new = old + '                        connectedDeviceCount = validClientCount,\n                        onOpenClients = { navController.navigate(RootDestination.Clients.route) },\n'
          assert t.count(old) == 1
          app.write_text(t.replace(old, new))
          theme = root / 'java/be/mygod/vpnhotspot/ui/theme/Theme.kt'
          t = theme.read_text()
          substitutions = {
              '0xFF68DBCC':'0xFF35EDC5',
              '0xFF003731':'0xFF031510',
              '0xFF164943':'0xFF0E2228',
              '0xFFCBF3EB':'0xFFBFFCEE',
              '0xFF0C1719':'0xFF061116',
              '0xFF344D4A':'0xFF18323A',
              '0xFF152528':'0xFF0E2228',
              '0xFFE0F0EB':'0xFFF1FAFB',
              '0xFFA8C3BC':'0xFFA6C2C6',
          }
          for old, new in substitutions.items():
              assert old in t, old
              t = t.replace(old, new)
          theme.write_text(t)
          PYTHON

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build Android debug APKs
        working-directory: upstream
        run: ./gradlew :mobile:assembleDebug --no-daemon

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: VPNHots-UI-Debug-APKs
          path: upstream/mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
